[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blinnfit"
version = "0.1.0"
authors = [
  { name="kwan3217", email="kwan3217@gmail.com" },
]
description = "Figure out photogrammetry from degraded copies of Blinn's animations"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies=[
    "spiceypy",
    "matplotlib",
    "pytest",
    "opencv-python",
    "kwanmath @ git+ssh://git@github.com/kwan3217/kwanmath.git",
    "kwanspice @ git+ssh://git@github.com/kwan3217/kwanspice.git",
]

[project.urls]
Homepage = "https://github.com/kwan3217/blinnfit/"
Issues = "https://github.com/kwan3217/blinnfit/issues"
